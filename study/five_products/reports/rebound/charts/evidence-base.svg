<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 274" width="880" height="274" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Most direct public document read per device (5 devices)</title><desc>Each device is counted once, under the most direct kind of document that yielded text. A product page or brochure rarely settles a capability either way.</desc><rect x="0.5" y="0.5" width="879" height="273" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="16.0" y="27.0" font-size="15" text-anchor="start" font-weight="600" fill="#1f2328">Most direct public document read per device (5 devices)</text><text x="16.0" y="47.0" font-size="12" text-anchor="start" font-weight="normal" fill="#59636e">Each device is counted once, under the most direct kind of document that yielded text. A product page or brochure rarely settles a</text><text x="16.0" y="63.0" font-size="12" text-anchor="start" font-weight="normal" fill="#59636e">capability either way.</text><rect x="16.0" y="77" width="12" height="12" rx="2" fill="#009E73" stroke="#d0d7de"/><text x="34.0" y="87.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">DNP3 device profile</text><rect x="175.6" y="77" width="12" height="12" rx="2" fill="#56B4E9" stroke="#d0d7de"/><text x="193.6" y="87.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Conformance statement</text><rect x="348.0" y="77" width="12" height="12" rx="2" fill="#CC79A7" stroke="#d0d7de"/><text x="366.0" y="87.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Security guide</text><rect x="475.6" y="77" width="12" height="12" rx="2" fill="#0072B2" stroke="#d0d7de"/><text x="493.6" y="87.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Manual</text><rect x="552.0" y="77" width="12" height="12" rx="2" fill="#E69F00" stroke="#d0d7de"/><text x="570.0" y="87.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Data sheet or brochu