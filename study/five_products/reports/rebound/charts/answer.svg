<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 342" width="880" height="342" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Is control traffic protected, according to the documents? (5 devices)</title><desc>Each device is placed once, under the strongest thing the reviewed documents establish for a control protocol. Encryption documented means the traffic need not be plaintext; every other group has no documented encryption of control traffic.</desc><rect x="0.5" y="0.5" width="879" height="341" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="16.0" y="27.0" font-size="15" text-anchor="start" font-weight="600" fill="#1f2328">Is control traffic protected, according to the documents? (5 devices)</text><text x="16.0" y="47.0" font-size="12" text-anchor="start" font-weight="normal" fill="#59636e">Each device is placed once, under the strongest thing the reviewed documents establish for a control protocol. Encryption documented</text><text x="16.0" y="63.0" font-size="12" text-anchor="start" font-weight="normal" fill="#59636e">means the traffic need not be plaintext; every other group has no documented encryption of control traffic.</text><rect x="16.0" y="77" width="12" height="12" rx="2" fill="#009E73" stroke="#d0d7de"/><text x="34.0" y="87.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Encryption documented</text><rect x="188.4" y="77" width="12" height="12" rx="2" fill="#56B4E9" stroke="#d0d7de"/><text x="206.4" y="87.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Authentication or integrity documented, encryption not</text><rect x="16.0" y="97" width="12" height="12" rx="2" fill="#0072B2" stroke="#d0d7de"/><text x="34.0" y="107.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">A security mechanism is named, what it protects is not stated</text><rect x="444.4" y="97" width="12" height="12" rx="2" fill="#CC79A7" stroke="#d0d7de"/><text x="462.4" y="107.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Only through an external gateway or encrypting device</text><rect x="16.0" y="117" width="12" height="12" rx="2" fill="#D55E00" stroke="#d0d7de"/><text x="34.0" y="127.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Vendor states it is not protected</text><rect x="265.2" y="117" width="12" height="12" rx="2" fill="#E69F00" stroke="#d0d7de"/><text x="283.2" y="127.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">A complete manual was read and documents none</text><rect x="16.0" y="137" width="12" height="12" rx="2" fill="#F0E442" stroke="#d0d7de"/><text x="34.0" y="147.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Documented for management access only, not for control traffic</text><rect x="450.8" y="137" width="12" height="12" rx="2" fill="#8c959f" stroke="#d0d7de"/><text x="468.8" y="147.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Not settled by the public documents</text><rect x="712.8" y="137" width="12" height="12" rx="2" fill="#e6e9ec" stroke="#d0d7de"/><text x="730.8" y="147.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2328">Not reviewed</text><line x1="16" y1="166" x2="864" y2="166" stroke="#d0d7de"/><text x="16.0" y="182.0" font-size="11" text-anchor="start" font-weight="normal" fill="#59636e">By vendor</text><text x="240.0" y="205.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">SEL</text><rect x="250.0" y="191" width="574.0" height="20" fill="#009E73" stroke="#ffffff"><title>Encryption documented: 1</title></rect><text x="537.0" y="205.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#ffffff">1</text><text x="830.0" y="205.0" font-size="12" text-anchor="start" font-weight="600" fill="#1f2328">1</text><text x="240.0" y="234.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">Schneider Electric</text><rect x="250.0" y="220" width="574.0" height="20" fill="#56B4E9" stroke="#ffffff"><title>Authentication or integrity documented, encryption not: 1</title></rect><text x="537.0" y="234.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2328">1</text><text x="830.0" y="234.0" font-size="12" text-anchor="start" font-weight="600" fill="#1f2328">1</text><text x="240.0" y="263.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">Rockwell Automation / Allen-Bradley</text><rect x="250.0" y="249" width="574.0" height="20" fill="#8c959f" stroke="#ffffff"><title>Not settled by the public documents: 1</title></rect><text x="537.0" y="263.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#ffffff">1</text><text x="830.0" y="263.0" font-size="12" text-anchor="start" font-weight="600" fill="#1f2328">1</text><text x="240.0" y="292.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">GE Vernova / Multilin</text><rect x="250.0" y="278" width="574.0" height="20" fill="#F0E442" stroke="#ffffff"><title>Documented for management access only, not for control traffic: 1</title></rect><text x="537.0" y="292.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2328">1</text><text x="830.0" y="292.0" font-size="12" text-anchor="start" font-weight="600" fill="#1f2328">1</text><text x="240.0" y="321.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">Siemens</text><rect x="250.0" y="307" width="574.0" height="20" fill="#F0E442" stroke="#ffffff"><title>Documented for management access only, not for control traffic: 1</title></rect><text x="537.0" y="321.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2328">1</text><text x="830.0" y="321.0" font-size="12" text-anchor="start" font-weight="600" fill="#1f2328">1</text></svg>
