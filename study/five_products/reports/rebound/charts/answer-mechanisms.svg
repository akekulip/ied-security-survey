<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Which kind of security: mechanism documented for control traffic</title><desc>Devices for which the mechanism is supported or conditional for a control protocol, out of the devices in the group. DNP3 Secure Authentication authenticates and does not encrypt; CIP Security always authenticates and encrypts only where confidentiality is configured.</desc><rect x="0.5" y="0.5" width="879" height="261" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="16.0" y="27.0" font-size="15" text-anchor="start" font-weight="600" fill="#1f2328">Which kind of security: mechanism documented for control traffic</text><text x="16.0" y="47.0" font-size="12" text-anchor="start" font-weight="normal" fill="#59636e">Devices for which the mechanism is supported or conditional for a control protocol, out of the devices in the group. DNP3 Secure</text><text x="16.0" y="63.0" font-size="12" text-anchor="start" font-weight="normal" fill="#59636e">Authentication authenticates and does not encrypt; CIP Security always authenticates and encrypts only where confidentiality is</text><text x="16.0" y="79.0" font-size="12" text-anchor="start" font-weight="normal" fill="#59636e">configured.</text><text x="557.0" y="114.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#59636e">All devices</text><text x="240.0" y="139.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">DNP3 Secure Authentication</text><rect x="251.0" y="123" width="612.0" height="24" fill="#cce3f0" stroke="#d0d7de"><title>DNP3 Secure Authentication, All devices: 1 of 5</title></rect><text x="557.0" y="139.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2328">1 of 5</text><text x="240.0" y="165.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">TLS</text><rect x="251.0" y="149" width="612.0" height="24" fill="#cce3f0" stroke="#d0d7de"><title>TLS, All devices: 1 of 5</title></rect><text x="557.0" y="165.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2328">1 of 5</text><text x="240.0" y="191.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">IPsec</text><rect x="251.0" y="175" width="612.0" height="24" fill="#ffffff" stroke="#d0d7de"><title>IPsec, All devices: 0 of 5</title></rect><text x="557.0" y="191.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2328">0 of 5</text><text x="240.0" y="217.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">CIP Security</text><rect x="251.0" y="201" width="612.0" height="24" fill="#ffffff" stroke="#d0d7de"><title>CIP Security, All devices: 0 of 5</title></rect><text x="557.0" y="217.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2328">0 of 5</text><text x="240.0" y="243.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1f2328">SSH</text><rect x="251.0" y="227" width="612.0" height="24" fill="#ffffff" stroke="#d0d7de"><title>SSH, All devices: 0 of 5</title></rect><text x="557.0" y="243.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2328">0 of 5</text></svg>
